# Base Configuration
# All hyperparameters should be configured here
# No magic numbers in code

dataset:
  name: "Salesforce/xlam-function-calling-60k"
  adapter: "xlam"  # Only this changes for new datasets
  cache_dir: "./data/cache"
  train_split: "train"
  validation_split: "validation"
  test_split: "test"

model:
  name: "Qwen/Qwen2.5-0.5B"  # ~0.5B model for T4
  model_type: "base"  # "base", "chat", or "instruct"
  torch_dtype: "bfloat16"
  device_map: "auto"
  trust_remote_code: true

training:
  output_dir: "./outputs/checkpoints"
  num_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 5.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_steps: -1
  gradient_checkpointing: true
  mixed_precision: "bf16"
  save_strategy: "steps"
  save_steps: 500
  eval_strategy: "steps"
  eval_steps: 500
  save_total_limit: 3
  seed: 42

optimization:
  type: "lora"  # "lora" or "qlora"
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

inference:
  temperature: 0.0
  max_new_tokens: 512
  top_p: 1.0
  top_k: 50
  repetition_penalty: 1.0
  do_sample: false

logging:
  level: "INFO"
  log_dir: "./logs"
  tensorboard_dir: "./outputs/tensorboard"
  wandb_project: "llm-decision-framework"
  wandb_enabled: false

paths:
  data_raw: "./data/raw"
  data_processed: "./data/processed"
  models_dir: "./models"
  outputs_dir: "./outputs"
  scripts_dir: "./scripts"
